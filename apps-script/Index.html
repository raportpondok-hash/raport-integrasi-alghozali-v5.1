<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raport Integrasi Al-Ghozali V5</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; padding: 0; border: 0; }
      body { overflow: hidden; background: #f5f5f4; }
    </style>
  </head>
  <body>
    <iframe id="app" title="Raport Integrasi Al-Ghozali V5" allow="clipboard-read; clipboard-write"></iframe>
    <script>
      google.script.run
        .withSuccessHandler(function(url) {
          if (!url) {
            document.body.innerHTML = '<div style="font-family:Arial;padding:24px">APP_URL belum dikonfigurasi di Script Properties.</div>';
            return;
          }
          document.getElementById('app').src = url;
        })
        .withFailureHandler(function(err) {
          document.body.innerHTML = '<div style="font-family:Arial;padding:24px">Gagal memuat aplikasi: ' + String(err) + '</div>';
        })
        .getAppUrl_();
    </script>
  </body>
</html>
